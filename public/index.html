<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebApp Project</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <h1>WebApp Project</h1>
    <p>Welcome to the CoderWanda DevOps practical web application.</p>
    <nav>
      <a class="button" href="/login.html">Log in</a>
      <a class="button secondary" href="/register.html">Register</a>
    </nav>
    <p class="status">Application status: <span id="status">checking...</span></p>
  </main>
  <script>
    fetch("/health").then(r => r.json()).then(data => {
      document.getElementById("status").textContent = data.status;
    }).catch(() => {
      document.getElementById("status").textContent = "unavailable";
    });
  </script>
</body>
</html>
